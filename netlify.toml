# Netlify configuration file for Phone Koi Monorepo

[build]
  # Point Netlify to the Next.js frontend folder in the monorepo
  base = "antigravity-frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.0.0"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  # Redirect any local API calls to the production backend
  from = "/api/*"
  to = "https://phonekoi-backend.onrender.com/:splat" # Replace with actual deployed backend URL
  status = 200
